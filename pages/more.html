<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <script>
    /* Early Internet Xətası gate — before CSS/JS */
    (function () {
      if (navigator.onLine) return;
      document.documentElement.classList.add('nexora-offline');
      var css = document.createElement('style');
      css.id = 'nexoraEarlyOfflineCss';
      css.textContent = 'html,body{background:#0b0b0b!important;margin:0;overflow:hidden!important}' +
        '#nexoraEarlyOffline{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;' +
        'padding:24px;background:#0b0b0b;color:#fff;text-align:center;font-family:system-ui,sans-serif}' +
        '#nexoraEarlyOffline .box{max-width:360px}#nexoraEarlyOffline .logo{font-weight:900;letter-spacing:.16em;color:#FF0000;font-size:1.4rem;margin-bottom:14px}' +
        '#nexoraEarlyOffline h1{margin:0 0 10px;font-size:1.45rem}#nexoraEarlyOffline p{margin:0;color:#bbb;line-height:1.5}';
      (document.head || document.documentElement).appendChild(css);
      function paint() {
        if (document.getElementById('nexoraEarlyOffline')) return;
        var el = document.createElement('div');
        el.id = 'nexoraEarlyOffline';
        el.innerHTML = '<div class="box"><div class="logo">NEXORA</div><h1>Internet Xətası</h1>' +
          '<p>İnternet bağlantısı yoxdur.</p></div>';
        (document.body || document.documentElement).appendChild(el);
      }
      if (document.body) paint();
      else document.addEventListener('DOMContentLoaded', paint);
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daha çox | NEXORA</title>
  <link rel="stylesheet" href="../css/main.css?v=20260807e">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#FF0000">
  <style>
    .more-links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      padding-bottom: 40px;
    }
    .more-link-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 18px 16px;
      border: 1px solid var(--color-border, #e5e5e5);
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      background: var(--color-bg-card, #fff);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .35s ease, transform .35s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .more-link-card.is-in {
      opacity: 1;
      transform: translateY(0);
    }
    .more-link-card strong { font-size: 1.05rem; }
    .more-link-card span { font-size: 0.9rem; color: var(--color-text-muted, #777); }
    .more-link-card:hover, .more-link-card:active {
      border-color: var(--color-primary, #e00);
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
    }
    .more-loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--color-text-muted, #777);
      font-size: .9rem;
      min-height: 28px;
      margin-bottom: 12px;
    }
    .more-loading[hidden] { display: none !important; }
    .more-loading-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--color-primary, #e00);
      animation: morePulse 1s ease-in-out infinite;
    }
    @keyframes morePulse {
      0%, 100% { opacity: .35; transform: scale(.85); }
      50% { opacity: 1; transform: scale(1); }
    }
    @media (max-width: 768px) {
      .more-links-grid { grid-template-columns: 1fr; gap: 10px; }
      .more-link-card { min-height: 72px; padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div id="site-header"></div>
    <main class="page-content">
      <div class="page-hero">
        <div class="container">
          <nav class="breadcrumb">
            <a href="../index.html" data-i18n="home">Ana səhifə</a><span class="breadcrumb-sep">/</span><span data-i18n="more">Daha çox</span>
          </nav>
          <h1 data-i18n="more">Daha çox</h1>
          <p class="section-subtitle">Bölmələr bir-bir yüklənir — serveri yormadan</p>
        </div>
      </div>
      <div class="container section" style="padding-top:0">
        <div class="more-loading" id="moreLoading" aria-live="polite">
          <span class="more-loading-dot" aria-hidden="true"></span>
          <span id="moreLoadingText">Bölmələr yüklənir…</span>
        </div>
        <div id="moreLinks" class="more-links-grid"></div>
      </div>
    </main>
    <div id="site-footer"></div>
  </div>
  <script src="../js/icons.js?v=20260807e"></script>
  <script src="../js/components/modal.js?v=20260807e"></script>
  <script src="../js/components/toast.js?v=20260807e"></script>
  <script src="../js/connectivity.js?v=20260807e"></script>
  <script src="../js/app.js?v=20260807e"></script>
  <script src="../js/api.js?v=20260807e"></script>
  <script src="../js/security.js?v=20260807e"></script>
  <script src="../js/account.js?v=20260807e"></script>
  <script src="../js/cart.js?v=20260807e"></script>
  <script src="../js/wishlist.js?v=20260807e"></script>
  <script src="../js/search.js?v=20260807e"></script>
  <script src="../js/i18n.js?v=20260807e"></script>
  <script src="../js/shell.js?v=20260807e"></script>
  <script src="../js/livechat.js?v=20260807e"></script>
  <script src="../js/main.js?v=20260807e"></script>
  <script>
    (function () {
      'use strict';

      var links = [
        { href: 'lookbook.html', title: 'Lookbook', desc: 'Stil və kolleksiya baxışı', id: 'lookbook' },
        { href: 'compare.html', title: 'Müqayisə', desc: 'Məhsulları yan-yana müqayisə et', id: 'compare' },
        { href: 'brands.html', title: 'Brendlər', desc: 'Bütün brendlər', id: 'brands' },
        { href: 'news.html', title: 'Xəbərlər', desc: 'Texnologiya yenilikləri', id: 'news' },
        { href: 'about.html', title: 'Haqqımızda', desc: 'NEXORA haqqında', id: 'about' },
        { href: 'contact.html', title: 'Əlaqə', desc: 'Bizimlə əlaqə', id: 'contact' },
        { href: 'faq.html', title: 'FAQ', desc: 'Tez-tez verilən suallar', id: 'faq' },
        { href: 'track.html', title: 'Sifariş izlə', desc: 'Sifariş statusuna bax', id: 'track' },
        { href: 'wishlist.html', title: 'Seçilmişlər', desc: 'Bəyəndiyiniz məhsullar', id: 'wishlist' },
        { href: 'cart.html', title: 'Səbət', desc: 'Sifarişə hazır məhsullar', id: 'cart' }
      ];

      function labelFor(item) {
        if (typeof NexoraI18n !== 'undefined' && item.id && NexoraI18n.t(item.id) !== item.id) {
          return NexoraI18n.t(item.id);
        }
        return item.title;
      }

      function renderLinks() {
        var el = document.getElementById('moreLinks');
        var loading = document.getElementById('moreLoading');
        if (!el) return;
        el.innerHTML = links.map(function (l) {
          return '<a class="more-link-card is-in" href="' + l.href + '"><strong>' +
            labelFor(l).replace(/</g, '&lt;') + '</strong><span>' +
            String(l.desc || '').replace(/</g, '&lt;') + '</span></a>';
        }).join('');
        if (loading) loading.hidden = true;
        document.dispatchEvent(new CustomEvent('nexora:more-ready'));
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderLinks);
      } else {
        renderLinks();
      }
    })();
  </script>
</body>
</html>
