<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <script>
    /* Early Internet Xətası gate — before CSS/JS */
    (function () {
      if (navigator.onLine) return;
      document.documentElement.classList.add('nexora-offline');
      var css = document.createElement('style');
      css.id = 'nexoraEarlyOfflineCss';
      css.textContent = 'html,body{background:#0b0b0b!important;margin:0;overflow:hidden!important}' +
        '#nexoraEarlyOffline{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;' +
        'padding:24px;background:#0b0b0b;color:#fff;text-align:center;font-family:system-ui,sans-serif}' +
        '#nexoraEarlyOffline .box{max-width:360px}#nexoraEarlyOffline .logo{font-weight:900;letter-spacing:.16em;color:#FF0000;font-size:1.4rem;margin-bottom:14px}' +
        '#nexoraEarlyOffline h1{margin:0 0 10px;font-size:1.45rem}#nexoraEarlyOffline p{margin:0;color:#bbb;line-height:1.5}';
      (document.head || document.documentElement).appendChild(css);
      function paint() {
        if (document.getElementById('nexoraEarlyOffline')) return;
        var el = document.createElement('div');
        el.id = 'nexoraEarlyOffline';
        el.innerHTML = '<div class="box"><div class="logo">NEXORA</div><h1>Internet Xətası</h1>' +
          '<p>İnternet bağlantısı yoxdur.</p></div>';
        (document.body || document.documentElement).appendChild(el);
      }
      if (document.body) paint();
      else document.addEventListener('DOMContentLoaded', paint);
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FAQ | NEXORA</title>
  <link rel="stylesheet" href="../css/main.css?v=20260807s">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#FF0000">
</head>
<body>
  <div class="page-wrapper">
    <div id="site-header"></div>
    <main class="page-content">
      <div class="page-hero">
        <div class="container">
          <nav class="breadcrumb">
            <a href="../index.html" data-i18n="home">Ana səhifə</a><span class="breadcrumb-sep">/</span><span data-i18n="faq">FAQ</span>
          </nav>
          <h1>Tez-tez verilən suallar</h1>
          <p class="section-subtitle">Sifariş, çatdırılma, ödəniş və daha çoxu</p>
        </div>
      </div>
      <div class="container section" style="max-width:800px">
        <div class="flex flex-wrap gap-2 mb-6" id="faqCats"></div>
        <div id="faqList"></div>
      </div>
    </main>
    <div id="site-footer"></div>
  </div>
  <script src="../js/icons.js?v=20260807s"></script>
  <script src="../js/components/modal.js?v=20260807s"></script>
  <script src="../js/components/toast.js?v=20260807s"></script>
  <script src="../js/connectivity.js?v=20260807s"></script>
  <script src="../js/app.js?v=20260807s"></script>
  <script src="../js/api.js?v=20260807s"></script>
  <script src="../js/security.js?v=20260807s"></script>
  <script src="../js/account.js?v=20260807s"></script>
  <script src="../js/cart.js?v=20260807s"></script>
  <script src="../js/wishlist.js?v=20260807s"></script>
  <script src="../js/search.js?v=20260807s"></script>
  <script src="../js/i18n.js?v=20260807s"></script>
  <script src="../js/shell.js?v=20260807s"></script>
  <script src="../js/livechat.js?v=20260807s"></script>
  <script src="../js/pages-content.js?v=20260807s"></script>
  <script src="../js/main.js?v=20260807s"></script>
  <script>
    let faqs = [];
    let activeCat = 'Hamısı';

    function render() {
      const cats = ['Hamısı'].concat(Array.from(new Set(faqs.map(function (f) { return f.category; }))));
      document.getElementById('faqCats').innerHTML = cats.map(function (c) {
        return '<button type="button" class="btn btn-sm ' + (c === activeCat ? 'btn-primary' : 'btn-outline') +
          '" data-faq-cat="' + c + '">' + c + '</button>';
      }).join('');

      const list = activeCat === 'Hamısı' ? faqs : faqs.filter(function (f) { return f.category === activeCat; });
      document.getElementById('faqList').innerHTML = list.map(function (f) {
        return '<div class="faq-item" data-faq>' +
          '<button type="button" class="faq-question">' + f.question +
          '<span class="icon icon-sm" data-icon="chevronDown"></span></button>' +
          '<div class="faq-answer">' + f.answer + '</div></div>';
      }).join('');

      document.querySelectorAll('[data-faq-cat]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          activeCat = btn.getAttribute('data-faq-cat');
          render();
        });
      });
      document.querySelectorAll('[data-faq]').forEach(function (item) {
        item.querySelector('.faq-question').addEventListener('click', function () {
          item.classList.toggle('is-open');
        });
      });
      if (typeof NexoraIcons !== 'undefined') NexoraIcons.init();
    }

    document.addEventListener('DOMContentLoaded', async function () {
      const data = await NexoraApp.fetchJSON('data/faq.json');
      faqs = data.faqs || [];
      render();
    });
  </script>
</body>
</html>
