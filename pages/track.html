<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order Timeline | NEXORA</title>
  <link rel="stylesheet" href="../css/main.css?v=20260804i">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#FF0000">
</head>
<body>
  <div class="page-wrapper">
    <div id="site-header"></div>
    <main class="page-content">
      <div class="page-hero">
        <div class="container">
          <nav class="breadcrumb">
            <a href="../index.html" data-i18n="home">Ana səhifə</a><span class="breadcrumb-sep">/</span><span>Order Timeline</span>
          </nav>
          <h1>📦 Order Timeline</h1>
          <p class="section-subtitle">Sifarişin canlı statusu: qəbul → hazırlanır → kuryer → çatdırıldı</p>
        </div>
      </div>
      <div class="container section track-layout">
        <form id="trackForm" class="card"><div class="card-body">
          <div class="form-group">
            <label class="form-label" for="trackId">Sifariş nömrəsi</label>
            <input class="input" id="trackId" required placeholder="ord…">
          </div>
          <div class="form-group">
            <label class="form-label" for="trackEmail">E-poçt</label>
            <input type="email" class="input" id="trackEmail" required>
          </div>
          <button type="submit" class="btn btn-primary w-full">Canlı statusu göstər</button>
        </div></form>
        <div id="trackResult" class="card" hidden></div>
      </div>
    </main>
    <div id="site-footer"></div>
  </div>
  <script src="../js/icons.js?v=20260804i"></script>
  <script src="../js/components/modal.js?v=20260804i"></script>
  <script src="../js/components/toast.js?v=20260804i"></script>
  <script src="../js/api.js?v=20260804i"></script>
  <script src="../js/app.js?v=20260804i"></script>
  <script src="../js/security.js?v=20260804i"></script>
  <script src="../js/cart.js?v=20260804i"></script>
  <script src="../js/wishlist.js?v=20260804i"></script>
  <script src="../js/i18n.js?v=20260804i"></script>
  <script src="../js/search.js?v=20260804i"></script>
  <script src="../js/account.js?v=20260804i"></script>
  <script src="../js/order-timeline.js?v=20260804i"></script>
  <script src="../js/shell.js?v=20260804i"></script>
  <script src="../js/main.js?v=20260804i"></script>
  <script>
    (function () {
      var pollTimer = null;
      var lastKey = '';

      function stopPoll() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      function show(order) {
        var el = document.getElementById('trackResult');
        el.hidden = false;
        var tl = NexoraOrderTimeline.ensureTimeline(order);
        var items = (order.items || []).map(function (i) {
          return '<li>' + NexoraSecurity.escapeHtml(i.name) + ' ×' + i.qty + '</li>';
        }).join('');
        var total = order.total != null ? order.total : (order.totals && order.totals.total);
        el.innerHTML =
          '<div class="card-body">' +
            '<div class="flex justify-between items-start flex-wrap gap-2 mb-2">' +
              '<h2 class="heading-3 mb-0">' + NexoraSecurity.escapeHtml(order.id) + '</h2>' +
              (tl.live
                ? '<span class="badge badge-primary">Canlı yenilənir</span>'
                : '<span class="badge badge-dark">' + NexoraSecurity.escapeHtml((tl.currentStep && tl.currentStep.label) || '') + '</span>') +
            '</div>' +
            '<p class="text-sm text-muted mb-4">Tarix: ' +
              NexoraSecurity.escapeHtml(new Date(order.createdAt).toLocaleString('az-AZ')) + '</p>' +
            NexoraOrderTimeline.render(tl) +
            '<p class="mt-4 mb-2">Cəm: <strong>' + NexoraApp.formatPrice(total) + '</strong></p>' +
            '<ul class="text-sm mb-0">' + items + '</ul>' +
            (tl.live
              ? '<p class="text-xs text-muted mt-4 mb-0">Status avtomatik yenilənir (~15 san). Demo: ~45s hazırlanır · ~2.5 dəq kuryer · ~5 dəq çatdırıldı.</p>'
              : '') +
          '</div>';

        stopPoll();
        if (tl.live) {
          pollTimer = setInterval(function () {
            if (document.hidden) return;
            load(true);
          }, 15000);
        }
      }

      async function load(silent) {
        var oid = document.getElementById('trackId').value.trim();
        var em = document.getElementById('trackEmail').value.trim().toLowerCase();
        if (!oid || !em) return;
        var key = oid + '|' + em;
        try {
          var order = null;
          if (typeof NexoraApi !== 'undefined') {
            try {
              var health = await NexoraApi.health();
              if (health && health.ok) {
                var res = await NexoraApi.trackOrder(oid, em);
                order = res.order;
              }
            } catch (apiErr) {
              if (!silent) throw apiErr;
            }
          }
          if (!order) {
            var orders = NexoraAccount.getOrders();
            order = orders.find(function (o) {
              return o.id === oid && String(o.email || '').toLowerCase() === em;
            });
          }
          if (!order) {
            if (!silent) {
              NexoraToast.error('Sifariş tapılmadı');
              document.getElementById('trackResult').hidden = true;
              stopPoll();
            }
            return;
          }
          lastKey = key;
          show(order);
        } catch (e) {
          if (!silent) {
            NexoraToast.error(e.message || 'Xəta');
            document.getElementById('trackResult').hidden = true;
            stopPoll();
          }
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        var id = NexoraApp.getQueryParam('id');
        var email = NexoraApp.getQueryParam('email');
        if (id) document.getElementById('trackId').value = id;
        if (email) document.getElementById('trackEmail').value = email;

        // Prefill email from session
        if (!email && typeof NexoraAccount !== 'undefined') {
          NexoraAccount.getSession().then(function (u) {
            if (u && u.email && !document.getElementById('trackEmail').value) {
              document.getElementById('trackEmail').value = u.email;
              if (id) load(false);
            }
          });
        }

        document.getElementById('trackForm').addEventListener('submit', function (e) {
          e.preventDefault();
          load(false);
        });

        if (id && (email || document.getElementById('trackEmail').value)) {
          load(false);
        }
      });

      window.addEventListener('beforeunload', stopPoll);
    })();
  </script>
</body>
</html>
