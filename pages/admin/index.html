  <script>
    /* Early Internet Xətası gate — before CSS/JS */
    (function () {
      if (navigator.onLine) return;
      document.documentElement.classList.add('nexora-offline');
      var css = document.createElement('style');
      css.id = 'nexoraEarlyOfflineCss';
      css.textContent = 'html,body{background:#0b0b0b!important;margin:0;overflow:hidden!important}' +
        '#nexoraEarlyOffline{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;' +
        'padding:24px;background:#0b0b0b;color:#fff;text-align:center;font-family:system-ui,sans-serif}' +
        '#nexoraEarlyOffline .box{max-width:360px}#nexoraEarlyOffline .logo{font-weight:900;letter-spacing:.16em;color:#FF0000;font-size:1.4rem;margin-bottom:14px}' +
        '#nexoraEarlyOffline h1{margin:0 0 10px;font-size:1.45rem}#nexoraEarlyOffline p{margin:0;color:#bbb;line-height:1.5}';
      (document.head || document.documentElement).appendChild(css);
      function paint() {
        if (document.getElementById('nexoraEarlyOffline')) return;
        var el = document.createElement('div');
        el.id = 'nexoraEarlyOffline';
        el.innerHTML = '<div class="box"><div class="logo">NEXORA</div><h1>Internet Xətası</h1>' +
          '<p>İnternet bağlantısı yoxdur.</p></div>';
        (document.body || document.documentElement).appendChild(el);
      }
      if (document.body) paint();
      else document.addEventListener('DOMContentLoaded', paint);
    })();
  </script>

  <script>
    (function () {
      function showError(msg) {
        var el = document.getElementById('loginError');
        if (!el) return;
        el.textContent = msg || '';
        el.classList.toggle('is-visible', !!msg);
      }

      async function doLogin(email, password) {
        showError('');
        var btn = document.getElementById('adminLoginBtn');
        if (btn) btn.disabled = true;
        try {
          var apiOk = false;
          if (typeof NexoraApi !== 'undefined') {
            try {
              var h = await NexoraApi.health();
              apiOk = !!(h && h.ok);
            } catch (e) { apiOk = false; }
          }
          if (apiOk) {
            var data = await NexoraApi.login(email, password);
            if (!data.user || data.user.role !== 'admin') {
              NexoraApi.clearToken();
              throw new Error('Bu hesabın admin hüququ yoxdur');
            }
          } else {
            if (typeof NexoraAccount === 'undefined') throw new Error('Auth modul yüklənmədi');
            await NexoraAccount.seedUsers();
            var user = await NexoraAccount.login(email, password);
            if (!user || user.role !== 'admin') {
              NexoraAccount.logout();
              throw new Error('Bu hesabın admin hüququ yoxdur');
            }
          }
          if (typeof window.NexoraAdminBoot === 'function') await window.NexoraAdminBoot();
          else document.dispatchEvent(new CustomEvent('nexora:admin-login'));
        } catch (e) {
          showError(e.message || 'Giriş alınmadı');
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      function bind() {
        var form = document.getElementById('adminLoginForm');
        var resetBtn = document.getElementById('adminResetUsers');
        var hint = document.getElementById('adminDemoHint');
        if (hint && typeof NexoraAccount !== 'undefined' && NexoraAccount.DEMO_HINT) {
          // Credentials only when explicitly requested: admin/?dev=1
          var showHint = /[?&]dev=1\b/.test(location.search || '');
          hint.hidden = !showHint;
          if (showHint) {
            hint.textContent = 'Dev: ' + NexoraAccount.DEMO_HINT.admin.email + ' / ' + NexoraAccount.DEMO_HINT.admin.password;
          }
        }
        if (form) {
          form.addEventListener('submit', function (e) {
            e.preventDefault();
            doLogin(
              document.getElementById('adminEmail').value,
              document.getElementById('adminPassword').value
            );
          });
        }
        if (resetBtn) {
          resetBtn.addEventListener('click', async function () {
            if (!window.confirm('Bütün istifadəçi/sessiya məlumatı silinib seed-ə qayıdacaq. Davam?')) return;
            try {
              if (typeof NexoraApi !== 'undefined') NexoraApi.clearToken();
              await NexoraAccount.resetAuthStore();
              showError('');
              if (hint) {
                hint.hidden = false;
                hint.textContent = 'Sıfırlandı. Demo: ' + NexoraAccount.DEMO_HINT.admin.email + ' / ' + NexoraAccount.DEMO_HINT.admin.password;
              }
              if (typeof NexoraToast !== 'undefined') NexoraToast.success('Auth sıfırlandı');
            } catch (e) {
              showError(e.message || 'Sıfırlama alınmadı');
            }
          });
        }
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
      else bind();
    })();
  </script>
