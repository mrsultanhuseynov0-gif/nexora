<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <script>
    /* Early Internet Xətası gate — before CSS/JS */
    (function () {
      if (navigator.onLine) return;
      document.documentElement.classList.add('nexora-offline');
      var css = document.createElement('style');
      css.id = 'nexoraEarlyOfflineCss';
      css.textContent = 'html,body{background:#0b0b0b!important;margin:0;overflow:hidden!important}' +
        '#nexoraEarlyOffline{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;' +
        'padding:24px;background:#0b0b0b;color:#fff;text-align:center;font-family:system-ui,sans-serif}' +
        '#nexoraEarlyOffline .box{max-width:360px}#nexoraEarlyOffline .logo{font-weight:900;letter-spacing:.16em;color:#FF0000;font-size:1.4rem;margin-bottom:14px}' +
        '#nexoraEarlyOffline h1{margin:0 0 10px;font-size:1.45rem}#nexoraEarlyOffline p{margin:0;color:#bbb;line-height:1.5}';
      (document.head || document.documentElement).appendChild(css);
      function paint() {
        if (document.getElementById('nexoraEarlyOffline')) return;
        var el = document.createElement('div');
        el.id = 'nexoraEarlyOffline';
        el.innerHTML = '<div class="box"><div class="logo">NEXORA</div><h1>Internet Xətası</h1>' +
          '<p>İnternet bağlantısı yoxdur.</p></div>';
        (document.body || document.documentElement).appendChild(el);
      }
      if (document.body) paint();
      else document.addEventListener('DOMContentLoaded', paint);
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lookbook | NEXORA</title>
  <link rel="stylesheet" href="../css/main.css?v=20260807i">
  <link rel="manifest" href="../manifest.webmanifest">
</head>
<body>
  <div class="page-wrapper">
    <div id="site-header"></div>
    <main class="page-content">
      <section class="lookbook-hero" id="lookbookHero">
        <div class="lookbook-hero-inner">
          <p class="lookbook-kicker">NEXORA Lookbook</p>
          <h1 class="lookbook-title">Mövsümün ritmi</h1>
          <p class="lookbook-sub">Premium seçimlər — atmosfera və stil bir yerdə</p>
          <a href="products.html" class="btn btn-primary">Kolleksiyaya keç</a>
        </div>
      </section>
      <div class="lookbook-strip" id="lookbookStrip"></div>
      <div class="container section">
        <h2 class="section-title mb-6">Seçilmişlər</h2>
        <div class="product-grid" id="lookbookProducts"></div>
      </div>
    </main>
    <div id="site-footer"></div>
  </div>
  <script src="../js/icons.js?v=20260807i"></script>
  <script src="../js/components/modal.js?v=20260807i"></script>
  <script src="../js/components/toast.js?v=20260807i"></script>
  <script src="../js/connectivity.js?v=20260807i"></script>
  <script src="../js/app.js?v=20260807i"></script>
  <script src="../js/api.js?v=20260807i"></script>
  <script src="../js/security.js?v=20260807i"></script>
  <script src="../js/account.js?v=20260807i"></script>
  <script src="../js/cart.js?v=20260807i"></script>
  <script src="../js/wishlist.js?v=20260807i"></script>
  <script src="../js/i18n.js?v=20260807i"></script>
  <script src="../js/search.js?v=20260807i"></script>
  <script src="../js/shell.js?v=20260807i"></script>
  <script src="../js/livechat.js?v=20260807i"></script>
  <script src="../js/main.js?v=20260807i"></script>
  <script>
    (async function () {
      const products = await NexoraApp.loadProducts();
      const campaigns = await NexoraApp.loadCampaigns();
      const strip = document.getElementById('lookbookStrip');
      const stories = (campaigns.campaigns || []).slice(0, 6);
      strip.innerHTML = stories.map(function (c, i) {
        return '<a class="lookbook-story" href="campaigns.html" style="--d:' + (i * 0.08) + 's">' +
          '<span class="lookbook-story-media" style="background:' + (c.gradient || 'linear-gradient(135deg,#111,#FF0000)') + '"></span>' +
          '<span class="lookbook-story-label">' + c.title + '</span></a>';
      }).join('') || '<p class="text-muted container">Kampaniya yoxdur.</p>';

      const picks = products.filter(function (p) { return p.badge || p.isNew; }).slice(0, 8);
      const grid = document.getElementById('lookbookProducts');
      grid.innerHTML = (picks.length ? picks : products.slice(0, 8))
        .map(function (p) { return NexoraApp.productCardHTML(p); }).join('');
      NexoraApp.bindProductActions(grid);
      if (typeof NexoraIcons !== 'undefined') NexoraIcons.init();
    })();
  </script>
</body>
</html>
