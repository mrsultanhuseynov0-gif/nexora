<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <script>
    /* Early Internet Xətası gate — before CSS/JS */
    (function () {
      if (navigator.onLine) return;
      document.documentElement.classList.add('nexora-offline');
      var css = document.createElement('style');
      css.id = 'nexoraEarlyOfflineCss';
      css.textContent = 'html,body{background:#0b0b0b!important;margin:0;overflow:hidden!important}' +
        '#nexoraEarlyOffline{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;' +
        'padding:24px;background:#0b0b0b;color:#fff;text-align:center;font-family:system-ui,sans-serif}' +
        '#nexoraEarlyOffline .box{max-width:360px}#nexoraEarlyOffline .logo{font-weight:900;letter-spacing:.16em;color:#FF0000;font-size:1.4rem;margin-bottom:14px}' +
        '#nexoraEarlyOffline h1{margin:0 0 10px;font-size:1.45rem}#nexoraEarlyOffline p{margin:0;color:#bbb;line-height:1.5}';
      (document.head || document.documentElement).appendChild(css);
      function paint() {
        if (document.getElementById('nexoraEarlyOffline')) return;
        var el = document.createElement('div');
        el.id = 'nexoraEarlyOffline';
        el.innerHTML = '<div class="box"><div class="logo">NEXORA</div><h1>Internet Xətası</h1>' +
          '<p>İnternet bağlantısı yoxdur.</p></div>';
        (document.body || document.documentElement).appendChild(el);
      }
      if (document.body) paint();
      else document.addEventListener('DOMContentLoaded', paint);
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="NEXORA məhsul kataloqu">
  <title>Məhsullar | NEXORA</title>
  <link rel="stylesheet" href="../css/main.css?v=20260807b">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#FF0000">
</head>
<body>
  <a href="#main-content" class="skip-link" data-i18n="skip_content">Əsas məzmuna keç</a>
  <div class="page-wrapper">
    <div id="site-header"></div>
    <main id="main-content" class="page-content">
      <div class="page-hero">
        <div class="container">
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="../index.html" data-i18n="home">Ana səhifə</a>
            <span class="breadcrumb-sep">/</span>
            <span data-i18n="products">Məhsullar</span>
          </nav>
          <h1 data-i18n="products">Məhsullar</h1>
          <p class="section-subtitle" id="productsMeta" data-i18n="loading">Yüklənir...</p>
        </div>
      </div>

      <div class="container catalog-layout">
        <div class="mobile-filter-bar">
          <button type="button" class="btn btn-outline" data-filters-open>
            <span class="icon icon-sm" data-icon="filter"></span> <span data-i18n="filter_sort">Filter / Sıralama</span>
          </button>
        </div>
        <div class="filters-backdrop" data-filters-close hidden></div>
        <aside class="catalog-filters" id="catalogFilters">
          <div class="mobile-filters-chrome">
            <div class="filters-sheet-handle" aria-hidden="true"></div>
            <div class="flex justify-between items-center mb-4">
              <h2 class="heading-4 mb-0" data-i18n="filters">Filterlər</h2>
              <button type="button" class="icon-btn" data-filters-close data-i18n-aria="close" aria-label="Bağla">
                <span class="icon icon-md" data-icon="close"></span>
              </button>
            </div>
          </div>
          <form id="filtersForm">
            <div class="filter-group">
              <h3 class="filter-title" data-i18n="category">Kateqoriya</h3>
              <div class="form-check-group" id="filterCategories"></div>
            </div>
            <div class="filter-group">
              <h3 class="filter-title" data-i18n="brand">Brend</h3>
              <div class="form-check-group" id="filterBrands"></div>
            </div>
            <div class="filter-group">
              <h3 class="filter-title" data-i18n="price">Qiymət</h3>
              <div class="flex gap-2">
                <input type="number" class="input" id="filterMin" placeholder="Min" min="0">
                <input type="number" class="input" id="filterMax" placeholder="Max" min="0">
              </div>
            </div>
            <div class="filter-group">
              <label class="form-check">
                <input type="checkbox" class="form-check-input" id="filterStock">
                <span class="form-check-label" data-i18n="stock_only">Yalnız stokda</span>
              </label>
            </div>
            <button type="submit" class="btn btn-primary w-full mb-2" data-i18n="apply">Tətbiq et</button>
            <button type="button" class="btn btn-outline w-full" id="filtersReset" data-i18n="reset">Sıfırla</button>
          </form>
        </aside>

        <div>
          <div class="catalog-toolbar">
            <div class="catalog-view-toggle" role="group" aria-label="Görünüş">
              <button type="button" class="catalog-view-btn is-active" data-view-mode="grid" aria-label="Grid görünüş">
                <span class="icon icon-sm" data-icon="grid"></span>
              </button>
              <button type="button" class="catalog-view-btn" data-view-mode="list" aria-label="Siyahı görünüş">
                <span class="icon icon-sm" data-icon="list"></span>
              </button>
            </div>
            <span class="text-sm text-muted" data-i18n="sort">Sıralama</span>
            <select class="input" id="filterSort" form="filtersForm" style="max-width:220px">
              <option value="newest" data-i18n="sort_new">Ən yeni</option>
              <option value="price-asc" data-i18n="sort_price_asc">Qiymət: aşağı → yuxarı</option>
              <option value="price-desc" data-i18n="sort_price_desc">Qiymət: yuxarı → aşağı</option>
              <option value="rating" data-i18n="rating">Reytinq</option>
              <option value="popular" data-i18n="sort_popular">Populyar</option>
            </select>
          </div>
          <div class="product-grid" id="productsGrid"></div>
          <div class="pagination" id="productsPager"></div>
        </div>
      </div>
    </main>
    <div id="site-footer"></div>
  </div>

  <script src="../js/icons.js?v=20260807b"></script>
  <script src="../js/components/modal.js?v=20260807b"></script>
  <script src="../js/components/toast.js?v=20260807b"></script>
  <script src="../js/connectivity.js?v=20260807b"></script>
  <script src="../js/app.js?v=20260807b"></script>
  <script src="../js/api.js?v=20260807b"></script>
  <script src="../js/security.js?v=20260807b"></script>
  <script src="../js/account.js?v=20260807b"></script>
  <script src="../js/cart.js?v=20260807b"></script>
  <script src="../js/wishlist.js?v=20260807b"></script>
  <script src="../js/search.js?v=20260807b"></script>
  <script src="../js/i18n.js?v=20260807b"></script>
  <script src="../js/shell.js?v=20260807b"></script>
  <script src="../js/livechat.js?v=20260807b"></script>
  <script src="../js/products.js?v=20260807b"></script>
  <script src="../js/main.js?v=20260807b"></script>
</body>
</html>
